<!DOCTYPE html>
<html lang="pt">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Quinta Outeiro da Serva</title>
		<meta name="robots" content="noindex">

		<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
		<link rel="alternate icon" href="/images/favicon.png" type="image/png">

		<!-- Speed: fetch the fonts of this screen straight away -->
		<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/source-sans-pro-900.woff2" crossorigin>
		<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/merriweather-300-italic.woff2" crossorigin>

		<link rel="stylesheet" href="/assets/css/main.css">
		<noscript><link rel="stylesheet" href="/assets/css/noscript.css"></noscript>
		<script src="/assets/js/main.js" defer></script>
	</head>
	<body class="is-preload landing">

		<!-- Background (dark image: see "8." in assets/css/main.css) -->
		<div id="bg"></div>

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Intro -->
			<div id="intro">
				<img src="/images/logo_ww.svg" alt="Quinta Outeiro da Serva" width="1056" height="336">
				<p id="message" style="display: none;">Obrigado pela visita, a redirecionar...</p>
			</div>

		</div>

		<script>
			// Leaving the site: display the message, wait 3 seconds, then go to the address below.
			window.addEventListener('load', function () {
				document.getElementById('message').style.display = 'block';
				window.setTimeout(function () {
					window.location.href = 'https://google.com/';
				}, 3000);
			});
		</script>

	</body>
</html>
