<!DOCTYPE HTML>
<html>
					<footer id="footer">
						<section>
							<form method="POST" action="/stocking">
							<div class="fields">
								<div class="field">
								<label for="name">Tipo de Vinho</label>
								<input type="text" name="name" pattern="^[1-5]$" title="Escolha um número de 1 a 5" required>
								</div>
								<div class="field">
								<label for="email">Pass</label>
								<input type="text" name="email" id="email" required>
								</div>
								<div class="field">
								<label for="message">Mensagem</label>
								<input type="number" name="message" min="1" max="999" title="Insira um número de 1 a 999" required>
								</div>
							</div>
							<ul class="actions">
								<li><input type="submit" value="Enviar Mensagem" /></li>
							</ul>
							</form>
						</section>		
					</footer>



		<!-- Scripts -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/jquery.scrollex.min.js"></script>
<script src="/assets/js/jquery.scrolly.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

	</body>
</html>
