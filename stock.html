<!DOCTYPE HTML>
<html>
					<footer id="footer">
						<section>
							<form method="POST" action="/stocking">
							<div class="fields">
								<div class="field">
								<label for="name">Tipo de Vinho</label>
								<input type="text" name="name" pattern="^[1-5]$" title="Escolha um número de 1 a 5" required>
								</div>
								<div class="field">
								<label for="email">Pass</label>
								<input type="text" name="email" id="email" required>
								</div>
								<div class="field">
								<label for="message">Mensagem</label>
								<input type="number" name="message" min="-9999" max="9999" title="Insira um número de 1 a 999" required>
								</div>
							</div>
							<ul class="actions">
								<li><input type="submit" value="Enviar Mensagem" /></li>
							</ul>
							<label>Tipo de Registo:</label>
							<select name="operacao" required>
							  <option value="" disabled selected>Escolha uma opção...</option>
							  <option value="consumo">Consumo</option>
							  <option value="vendas">Vendas</option>
							</select>
							</form>
						</section>		
					</footer>

					<div id="copyright">
<ul><li>Codigos Vinho:</li>
<li>Vinho Tinto Duas Castas 2024: 1</li>

<li>Vinho Tinto Três Castas 2025: 4</li>
<li>Vinho Branco Monocasta 2025: 5</li>

	
	
</ul>
					</div>

		<!-- Scripts -->
<script src="/assets/js/jquery.min.js"></script>

<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

	</body>
</html>
